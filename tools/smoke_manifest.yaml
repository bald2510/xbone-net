suite_name: xbone_complete_experiment_suite

# Each entry identifies one experiment planned in the thesis.
# Matching is case-insensitive and relative to --config-root.
# Add another pattern when your actual filename differs.

experiments:
  # -------------------------------------------------------------------------
  # Standard full-fine-tuning baselines
  # -------------------------------------------------------------------------
  - id: baseline_fft_densenet121
    patterns:
      - "**/baselines/full_finetuned/*densenet*.yaml"
      - "**/baselines/finetuned/*densenet*.yaml"
      - "**/baselines/full_finetune/*densenet*.yaml"
      - "**/baseline/full_finetune/*densenet*.yaml"
      - "**/full_finetune/*densenet*.yaml"

  - id: baseline_fft_resnet50
    patterns:
      - "**/baselines/full_finetuned/*resnet*.yaml"
      - "**/baselines/finetuned/*resnet*.yaml"
      - "**/baselines/full_finetune/*resnet*.yaml"
      - "**/baseline/full_finetune/*resnet*.yaml"
      - "**/full_finetune/*resnet*.yaml"

  - id: baseline_fft_clip
    patterns:
      - "**/baselines/full_finetuned/fft_clip.yaml"
      - "**/baselines/finetuned/clip.yaml"
      - "**/baselines/full_finetune/clip.yaml"
      - "**/baseline/full_finetune/clip.yaml"
      - "**/full_finetune/fft_clip.yaml"
      - "**/full_finetune/clip.yaml"
    exclude_contains: ["biomed", "pubmed", "medclip"]

  - id: baseline_fft_medclip
    patterns:
      - "**/baselines/full_finetuned/*medclip*.yaml"
      - "**/baselines/finetuned/*medclip*.yaml"
      - "**/baselines/full_finetune/*medclip*.yaml"
      - "**/baseline/full_finetune/*medclip*.yaml"
      - "**/full_finetune/*medclip*.yaml"
    exclude_contains: ["biomed", "pubmed"]

  - id: baseline_fft_pubmedclip
    patterns:
      - "**/baselines/full_finetuned/*pubmedclip*.yaml"
      - "**/baselines/finetuned/*pubmedclip*.yaml"
      - "**/baselines/full_finetune/*pubmedclip*.yaml"
      - "**/baseline/full_finetune/*pubmedclip*.yaml"
      - "**/full_finetune/*pubmedclip*.yaml"

  - id: baseline_fft_biomedclip
    patterns:
      - "**/baselines/full_finetuned/*biomedclip*.yaml"
      - "**/baselines/finetuned/*biomedclip*.yaml"
      - "**/baselines/full_finetune/*biomedclip*.yaml"
      - "**/baseline/full_finetune/*biomedclip*.yaml"
      - "**/full_finetune/*biomedclip*.yaml"

  # -------------------------------------------------------------------------
  # Phase-matched PEFT baselines
  # -------------------------------------------------------------------------
  - id: baseline_lora_pubmedclip
    patterns:
      - "**/baselines/peft_finetuned/*lora*pubmedclip*.yaml"
      - "**/baselines/peft_finetune/*lora*pubmedclip*.yaml"
      - "**/baseline/peft_finetune/*lora*pubmedclip*.yaml"
      - "**/peft_finetune/*lora*pubmedclip*.yaml"
      - "**/lora_pubmedclip*.yaml"

  - id: baseline_lora_biomedclip
    patterns:
      - "**/baselines/peft_finetuned/*lora*biomedclip*.yaml"
      - "**/baselines/peft_finetune/*lora*biomedclip*.yaml"
      - "**/baseline/peft_finetune/*lora*biomedclip*.yaml"
      - "**/peft_finetune/*lora*biomedclip*.yaml"
      - "**/lora_biomedclip*.yaml"

  # -------------------------------------------------------------------------
  # Main proposed model
  # -------------------------------------------------------------------------
  - id: proposed_xbone_highres
    patterns:
      - "**/proposed/xbone_highres.yaml"
      - "**/proposed/ours_xbone_net.yaml"
      - "**/proposed/*xbone*highres*.yaml"
      - "**/ours_xbone_net_variant_b_hr.yaml"
    exclude_contains: ["few", "ablation"]

  # -------------------------------------------------------------------------
  # Few-shot experiments: 1, 10 and 20 shots
  # -------------------------------------------------------------------------
  - id: fewshot_1_lora_pubmedclip
    patterns:
      - "**/few-shot/1_shot/*lora*pubmedclip*.yaml"
      - "**/few_shot/1_shot/*lora*pubmedclip*.yaml"
      - "**/few-shot/1-shot/*lora*pubmedclip*.yaml"

  - id: fewshot_1_lora_biomedclip
    patterns:
      - "**/few-shot/1_shot/*lora*biomedclip*.yaml"
      - "**/few_shot/1_shot/*lora*biomedclip*.yaml"
      - "**/few-shot/1-shot/*lora*biomedclip*.yaml"

  - id: fewshot_1_xbone_highres
    patterns:
      - "**/few-shot/1_shot/*xbone*.yaml"
      - "**/few_shot/1_shot/*xbone*.yaml"
      - "**/few-shot/1-shot/*xbone*.yaml"

  - id: fewshot_10_lora_pubmedclip
    patterns:
      - "**/few-shot/10_shot/*lora*pubmedclip*.yaml"
      - "**/few_shot/10_shot/*lora*pubmedclip*.yaml"
      - "**/few-shot/10-shot/*lora*pubmedclip*.yaml"

  - id: fewshot_10_lora_biomedclip
    patterns:
      - "**/few-shot/10_shot/*lora*biomedclip*.yaml"
      - "**/few_shot/10_shot/*lora*biomedclip*.yaml"
      - "**/few-shot/10-shot/*lora*biomedclip*.yaml"

  - id: fewshot_10_xbone_highres
    patterns:
      - "**/few-shot/10_shot/*xbone*.yaml"
      - "**/few_shot/10_shot/*xbone*.yaml"
      - "**/few-shot/10-shot/*xbone*.yaml"

  - id: fewshot_20_lora_pubmedclip
    patterns:
      - "**/few-shot/20_shot/*lora*pubmedclip*.yaml"
      - "**/few_shot/20_shot/*lora*pubmedclip*.yaml"
      - "**/few-shot/20-shot/*lora*pubmedclip*.yaml"

  - id: fewshot_20_lora_biomedclip
    patterns:
      - "**/few-shot/20_shot/*lora*biomedclip*.yaml"
      - "**/few_shot/20_shot/*lora*biomedclip*.yaml"
      - "**/few-shot/20-shot/*lora*biomedclip*.yaml"

  - id: fewshot_20_xbone_highres
    patterns:
      - "**/few-shot/20_shot/*xbone*.yaml"
      - "**/few_shot/20_shot/*xbone*.yaml"
      - "**/few-shot/20-shot/*xbone*.yaml"

  # -------------------------------------------------------------------------
  # Input ablations: resolution and modality
  # -------------------------------------------------------------------------
  - id: ablation_resolution_nohighres
    patterns:
      - "**/ablation_study/input/resolution/no_highres.yaml"

  - id: ablation_resampler_no_spatial_coordinates
    patterns:
      - "**/ablation_study/input/resolution/no_spatial_coordinates.yaml"

  - id: ablation_resampler_mean_pool
    patterns:
      - "**/ablation_study/input/resolution/mean_pool.yaml"

  - id: ablation_modality_image_only_phase2
    patterns:
      - "**/ablation_study/input/modality/image_only_phase2.yaml"

  - id: ablation_modality_text_only
    patterns:
      - "**/ablation_study/input/modality/text_only.yaml"

  - id: ablation_modality_strict_image_only
    patterns:
      - "**/ablation_study/input/modality/strict_image_only.yaml"

  - id: ablation_modality_shuffled_report_train_eval
    patterns:
      - "**/ablation_study/input/modality/shuffled_report_train_eval.yaml"

  - id: ablation_modality_test_time_shuffled_report
    patterns:
      - "**/ablation_study/input/modality/test_time_shuffled_report.yaml"

  - id: ablation_report_xray_to_clinical
    patterns:
      - "**/ablation_study/input/modality/phase1_xray_phase2_clinical.yaml"

  # -------------------------------------------------------------------------
  # Backbone / PEFT ablations
  # -------------------------------------------------------------------------
  - id: ablation_training_full_finetuning
    patterns:
      - "**/ablation_study/backbone/full_finetuning.yaml"

  - id: ablation_training_frozen_backbone
    patterns:
      - "**/ablation_study/backbone/frozen_backbone.yaml"

  - id: ablation_backbone_local_tile_no_grad
    patterns:
      - "**/ablation_study/backbone/local_tile_no_grad.yaml"



  # -------------------------------------------------------------------------
  # Fusion and classifier ablations
  # -------------------------------------------------------------------------
  - id: ablation_fusion_concat_empirical_centroid
    patterns:
      - "**/ablation_study/fusion/concat_empirical_centroid.yaml"

  - id: ablation_classifier_linear
    patterns:
      - "**/ablation_study/classifier/linear.yaml"

  - id: ablation_classifier_learnable_cosine
    patterns:
      - "**/ablation_study/classifier/learnable_cosine.yaml"

  - id: ablation_classifier_learnable_cosine_proto_loss
    patterns:
      - "**/ablation_study/classifier/learnable_cosine_proto_loss.yaml"

  - id: ablation_phase2_only
    patterns:
      - "**/ablation_study/backbone/phase2_only.yaml"

  - id: ablation_phase1_merged
    patterns:
      - "**/ablation_study/backbone/phase1_merged.yaml"

  # -------------------------------------------------------------------------
  # Out-of-distribution evaluation
  # -------------------------------------------------------------------------
  - id: ood_near_ood
    patterns:
      - "**/ood_evaluation/near_ood.yaml"

  - id: ood_domain_ood
    patterns:
      - "**/ood_evaluation/domain_ood.yaml"

  - id: ood_report_mismatch
    patterns:
      - "**/ood_evaluation/report_mismatch_ood.yaml"
