# Locked post-hoc OOD protocol for the canonical CTCH proposed model.
source_experiment: "ctch/proposed/ours_xbone_net"
seeds: [42, 123, 456]

fit_split: "ctch_train"
calibration_split: "ctch_val"
id_test_split: "ctch_test"
target_id_fpr: 0.05
knn_k: 5
methods: [cosine_centroids, mahalanobis_centroid, knn, entropy]
method_feature_keys:
  cosine_centroids: "fused_embeddings"
  mahalanobis_centroid: "fused_embeddings_raw"
  knn: "fused_embeddings"
  entropy: "logits"
n_bootstrap: 2000
bootstrap_seed: 3107

cosine_centroids:
  class_centers: "empirical_train_means"
  normalization: "l2_sample_and_centroid"
  class_reduction: "maximum_similarity"
  ood_score: "one_minus_maximum_cosine_similarity"

mahalanobis_centroid:
  input_feature: "fused_embeddings_raw"
  formulation: "classical_distance"
  class_centers: "empirical_train_means"
  covariance: "shared_ledoit_wolf"
  class_reduction: "minimum"
  detector_l2_normalization: false

scenarios:
  semantic_ood:
    archive: "ctch_ood"
    feature_key: "fused_embeddings"
    primary_methods: [cosine_centroids, mahalanobis_centroid, knn, entropy]
    primary: true
  domain_ood:
    archive: "fracatlas_test"
    feature_key: "fused_embeddings"
    primary_methods: [cosine_centroids, mahalanobis_centroid, knn, entropy]
    primary: true
    rationale: "All scores are evaluated from the trained bidirectional fused representation, which combines global image, high-resolution local image, and clinical-text evidence."
  domain_ood_btxrd:
    archive: "btxrd_test"
    feature_key: "fused_embeddings"
    primary_methods: [cosine_centroids, mahalanobis_centroid, knn, entropy]
    primary: true
    rationale: "BTXRD is evaluated as multimodal cross-dataset OOD on the trained bidirectional fused representation. Results must be interpreted with the synthetic clinical_v2 report schema in mind."
  report_mismatch_cross_class:
    archive: "report_mismatch_cross_class"
    feature_key: "fused_embeddings"
    primary_methods: [cosine_centroids, mahalanobis_centroid, knn, entropy]
    paired_by_image_id: true
    primary: true
  report_mismatch_same_class:
    archive: "report_mismatch_same_class"
    feature_key: "fused_embeddings"
    primary_methods: [cosine_centroids, mahalanobis_centroid, knn, entropy]
    paired_by_image_id: true
    primary: false
