# @package _global_

name: 'btxrd'
batch_size: 32
num_workers: 0

params:
  img_dir: "${hydra:runtime.cwd}/data/BTXRD/images"
  report_dir: "${hydra:runtime.cwd}/data/BTXRD/reports"
  csv_split_path: "${hydra:runtime.cwd}/data/BTXRD/btxrd-split.csv"
  csv_labels_path: "${hydra:runtime.cwd}/data/BTXRD/btxrd-labels.csv"

  # Multi-class classification (10 leaf classes, ordered by frequency)
  task_type: "multiclass"
  num_classes: 10
  classes: [
    'normal',                    # 0: Bình thường (không có u)
    'osteochondroma',             # 1: U xương sụn
    'osteosarcoma' -> benign -> tumor,              # 2: Sarcoma xương (ác tính)
    'multiple osteochondromas',  # 3: Đa u xương sụn
    'simple bone cyst',          # 4: Nang xương đơn thuần
    'other bt',                  # 5: U lành tính khác
    'giant cell tumor',          # 6: U tế bào khổng lồ
    'synovial osteochondroma',   # 7: U sụn màng hoạt dịch
    'other mt',                  # 8: U ác tính khác
    'osteofibroma'               # 9: U xơ xương
  ]

  # Legacy: keep pathologies for backward compatibility
  pathologies: [
    'normal', 'osteochondroma', 'osteosarcoma',
    'multiple osteochondromas', 'simple bone cyst', 'other bt',
    'giant cell tumor', 'synovial osteochondroma', 'other mt',
    'osteofibroma'
  ]