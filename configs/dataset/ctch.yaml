# @package _global_

name: 'ctch'
batch_size: 16
num_workers: 0

params:
  img_dir: "${hydra:runtime.cwd}/data/CTCH/images"
  xray_report_dir: "${hydra:runtime.cwd}/data/CTCH/reports/xray"
  clinical_report_dir: "${hydra:runtime.cwd}/data/CTCH/reports/clinical"
  csv_split_path: "${hydra:runtime.cwd}/data/CTCH/ctch-split.csv"
  csv_labels_path: "${hydra:runtime.cwd}/data/CTCH/ctch-labels.csv"
  k_shot: null
  seed: ${seed}

  # Multi-class classification. This order must match data/CTCH/labels.txt.
  task_type: "multiclass"
  num_classes: 22
  classes: [
    'Bình thường',
    'Gãy xương quay',
    'Gãy xương cánh tay',
    'Gãy xương đùi',
    'Gãy xương ngón tay',
    'Gãy xương chày',
    'Gãy xương cẳng tay',
    'Gãy xương cổ chân',
    'Gãy xương cẳng chân',
    'Gãy xương vùng vai',
    'Gãy xương bàn chân',
    'Gãy cột sống thắt lưng',
    'Gãy xương bàn tay',
    'Gãy xương ngón chân',
    'Viêm khớp',
    'Gãy xương trụ',
    'Cắt cụt ngón tay',
    'Gãy xương bánh chè',
    'Gãy xương gót',
    'Gãy cột sống ngực',
    'Gãy xương thuyền',
    'Gãy xương vùng chậu',
  ]

  # English medical names used only to construct zero-shot text prompts.
  # Keep this list index-aligned with `classes`; Vietnamese names remain the
  # canonical CSV/class-ID labels used by the dataset and reported metrics.
  prompt_classes: [
    'Normal',
    'Radius fracture',
    'Humerus fracture',
    'Femur fracture',
    'Finger phalanx fracture',
    'Tibia fracture',
    'Forearm fracture',
    'Ankle fracture',
    'Lower leg fracture',
    'Shoulder girdle fracture',
    'Foot bone fracture',
    'Lumbar vertebral fracture',
    'Metacarpal fracture',
    'Toe phalanx fracture',
    'Arthritis',
    'Ulna fracture',
    'Finger amputation',
    'Patella fracture',
    'Calcaneus fracture',
    'Thoracic vertebral fracture',
    'Scaphoid fracture',
    'Pelvic fracture',
  ]
