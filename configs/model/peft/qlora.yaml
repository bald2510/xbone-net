# @package _global_

type: "qlora"
params:
  r: 16                        # Rank of LoRA update matrices
  alpha: 32                    # Scaling factor (recommended: alpha = 2 * r)
  dropout: 0.1                 # Dropout probability for LoRA layers
  quant_type: "nf4"            # Quantization type: "nf4" (Normal Float) or "fp4"
  double_quant: true           # Double quantization: quantize the quantization constants (~0.4 bits/param saved)

  # Target ALL linear layers in Image Encoder (ViT-B/16) for maximum accuracy
  visual_target_modules:
    - "attn.qkv"               # Fused Q/K/V attention projection
    - "attn.proj"              # Attention output projection
    - "mlp.fc1"                # MLP first layer (expansion)
    - "mlp.fc2"                # MLP second layer (contraction)

  # Target ALL linear layers in Text Encoder (PubMedBERT) for maximum accuracy
  text_target_modules:
    - "query"                  # Self-attention query
    - "key"                    # Self-attention key
    - "value"                  # Self-attention value
    - "attention.output.dense" # Attention output projection
    - "intermediate.dense"     # Feed-forward intermediate (expansion)
    - "output.dense"           # Feed-forward output (contraction)
