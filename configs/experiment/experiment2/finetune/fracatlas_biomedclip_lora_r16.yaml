# @package _global_

defaults:
  - /model/peft@model.peft: lora
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: fracatlas
  - _self_

# Khóa cứng cấu trúc model (như cũ)
model:
  _placeholder_: true

# KHÓA CỨNG CẤU TRÚC DATASET (THÊM VÀO ĐÂY)
dataset:
  _placeholder_: true

experiment_name: "finetune_biomedclip_lora_r16"

params:
  run_phase1: true
  model_dir: "checkpoints/fracatlas_biomedclip_lora_r16/"
  
  phase1:
    epochs: 5
    lr: 1e-4
    weight_decay: 1e-2
    checkpoint_path: "checkpoints/fracatlas_biomedclip_lora_r16/best_phase1.pth"
    temperature: 0.07
    loss_type: "sigclip"