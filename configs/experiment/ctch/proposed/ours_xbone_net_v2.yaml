# @package _global_
# ===============================================================================
# LoRA-r8 variant using the same original BiomedCLIP token path.
# Fusion: cross-attention | Head: linear classifier
# ===============================================================================

defaults:
  - /model/peft@model.peft: lora
  - /model/fusion@model.fusion: cross_attention
  - /model/classifier@model.classifier: linear
  - /dataset@dataset: ctch
  - _self_

experiment_name: ctch/proposed/ours_xbone_net_v2

model:
  backbone_type: biomedclip
  peft:
    params:
      r: 8
      alpha: 16

dataset:
  params:
    preprocess:
      strategy: direct_resize

params:
  model_dir: checkpoints/${experiment_name}/seed_${seed}/

  phase1:
    epochs: 30
    lr: 5e-5
    weight_decay: 1e-4
    early_stopping_patience: 3
    target_similarity: 0.50
    class_aware_sampling:
      enabled: true
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase1.pth

  phase2:
    lr: 1e-4
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase2.pth
    loss:
      label_smoothing: 0.1
      use_class_weights: true
      max_class_weight: 5.0
