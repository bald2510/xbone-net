# @package _global_
# ===============================================================================
# Proposed v6: v3 label-discriminative classifier + DRL auxiliary representation
# The existing v3 Phase-2 checkpoint is frozen; only the Phase-3 auxiliary
# branch is optimized on CTCH ID data.
# ===============================================================================

defaults:
  - /model/peft@model.peft: lora
  - /model/fusion@model.fusion: cross_attention
  - /model/classifier@model.classifier: empirical_centroid
  - /dataset@dataset: ctch
  - _self_

experiment_name: ctch/proposed/proposed_v6
seed: 42

model:
  backbone_type: biomedclip
  freeze_backbone: true
  num_visual_tokens: 20
  local_pool_grid: 2
  include_local_cls_token: true
  contrastive_local_weight: 0.25
  contrastive_pooling: attention
  contrastive_attention_hidden_dim: 128
  tile_encode_chunk_size: 32
  local_tile_grad_enabled: true
  local_tile_gradient_checkpointing: true
  visual_resampler:
    aggregation: passthrough
    use_spatial_coordinates: true
    spatial_coordinate_scale_init: 0.1
  classifier:
    params:
      use_class_bias: true
  drl:
    enabled: true
    feature_dim: 512
    params:
      hidden_dim: 512
      dropout: 0.1
      # Perturbation coefficient used by the finite-component DRL transform.
      epsilon: 0.001
      minimum_component_weight: 0.0001
      covariance_shrinkage: 0.0001

dataset:
  params:
    high_res:
      enabled: true
      strategy: sparse_focal
      global_size: 224
      tile_size: 224
      canonical_long_side: 896
      allow_upsample: false
      candidate_stride: 168
      num_tiles: 4
      coverage_tiles: 2
      cache_selection: true
      min_foreground_ratio: 0.60
      nms_iou: 0.30
      focal_diversity_weight: 0.35
      pad_value: border_median
      border_fraction: 0.04
      min_contrast: 0.035
      foreground:
        margin: 0.04
        border_fraction: 0.04
        min_contrast: 0.035
        min_axis_coverage: 0.01
        min_run_ratio: 0.03
        min_dimension_ratio: 0.35
        min_area_ratio: 0.20
        min_energy_retained: 0.95
        mask_max_side: 512

params:
  # v6 deliberately reuses the evaluated v3 classifier instead of retraining
  # it. Override these flags only for a fully fresh three-phase run.
  run_phase1: false
  run_phase2: false
  run_phase3: true
  run_ood: false
  model_dir: checkpoints/${experiment_name}/seed_${seed}/

  phase1:
    enabled: false
    epochs: 30
    lr: 5e-5
    weight_decay: 1e-4
    warmup_ratio: 0.1
    early_stopping_patience: 3
    loss_type: semantic_matching
    target_similarity: 0.50
    p1_report_type: clinical
    class_aware_sampling:
      enabled: true
      samples_per_class: 2
      seed: ${seed}
    merge_lora_after_training: false
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase1.pth
    merged_checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/merged_phase1.pth
    optimizer: adamw
    scheduler: cosine

  phase2:
    enabled: false
    epochs: 50
    lr: 1e-4
    weight_decay: 1e-4
    warmup_ratio: 0.1
    early_stopping_patience: 3
    use_text: true
    p2_report_type: clinical
    init_from_phase1_merged: false
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase2.pth
    loss_type: empirical_centroid_ce
    optimizer: adamw
    scheduler: cosine
    centroid:
      update_interval_epochs: 1
    loss:
      label_smoothing: 0.05
      use_class_weights: true
      weight_type: effective_num
      effective_num_beta: 0.999
      max_class_weight: 5.0

  phase3:
    enabled: true
    # This must point to the immutable v3 classifier used as the primary path.
    init_checkpoint_path: checkpoints/ctch/proposed/ours_xbone_net_v3/seed_${seed}/best_phase2.pth
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase3.pth
    epochs: 20
    lr: 1e-4
    weight_decay: 1e-4
    warmup_ratio: 0.1
    early_stopping_patience: 5
    report_type: clinical
    optimizer: adamw
    scheduler: cosine
    loss:
      label_smoothing: 0.05
      use_class_weights: true
      weight_type: effective_num
      effective_num_beta: 0.999
      max_class_weight: 5.0
