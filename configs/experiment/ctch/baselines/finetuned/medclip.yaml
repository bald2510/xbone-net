# @package _global_
# ===============================================================================
# Experiment Config: ctch/baselines/finetuned/medclip
# Backbone: medclip | PEFT: full_ft | Fusion: concat | Head: linear
# ===============================================================================

defaults:
  - /model/peft@model.peft: full_ft
  - /model/fusion@model.fusion: concat
  - /model/classifier@model.classifier: linear
  - /dataset@dataset: ctch
  - _self_

# --- Model Architecture ---
model:
  backbone_type: medclip
  freeze_backbone: false

# --- Experiment Identifier ---
experiment_name: ctch/baselines/finetuned/medclip

# --- Training Hyperparameters ---
params:
  run_phase1: false              # Baselines: no Phase 1 (standard fine-tuning only)
  run_phase2: true
  run_ood: false                 # Set true only for proposed model to calibrate OOD threshold
  model_dir: checkpoints//seed_/

  # --- Phase 2 Hyperparameters ---
  phase2:
    epochs: 50
    lr: 2e-5
    weight_decay: 1e-4
    optimizer: adamw
    scheduler: cosine
    warmup_ratio: 0.1
    early_stopping_patience: 5
    phase2_loss_type: ce
    use_text: true
    p2_report_type: clinical
    checkpoint_path: checkpoints//seed_/best_phase2.pth
    loss:
      proto_margin: 0.5
      lambda_proto: 0.3
      label_smoothing: 0.1
      use_class_weights: true
      max_class_weight: 10.0

# --- Global Random Seed ---
seed: 42
