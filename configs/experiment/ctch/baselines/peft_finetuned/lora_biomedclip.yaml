# @package _global_
# ===============================================================================
# Experiment Config: ctch/baselines/peft_finetuned/lora_biomedclip
# Backbone: biomedclip | PEFT: lora | Fusion: concat | Head: linear
# Description: Two-Phase PEFT Baseline using LoRA.
# ===============================================================================

defaults:
- /model/peft@model.peft: lora
- /model/fusion@model.fusion: concat
- /model/classifier@model.classifier: linear
- /dataset@dataset: ctch
- _self_

# --- Model Architecture ---
model:
  backbone_type: biomedclip
  freeze_backbone: true

# --- Experiment Identifier ---
experiment_name: ctch/baselines/peft_finetuned/lora_biomedclip
seed: 42

# --- Training Hyperparameters ---
params:
  run_phase1: true
  run_phase2: true
  run_ood: false
  model_dir: checkpoints/${experiment_name}/seed_${seed}/
  phase1:
    enabled: true
    epochs: 30
    lr: 5e-5
    weight_decay: 0.0001
    warmup_ratio: 0.1
    early_stopping_patience: 3
    loss_type: semantic_matching
    # Shared optimization protocol with proposed v3.
    target_similarity: 0.50
    p1_report_type: clinical
    class_aware_sampling:
      enabled: true
      samples_per_class: 2
      seed: ${seed}
    merge_lora_after_training: false
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase1.pth
    merged_checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/merged_phase1.pth
    optimizer: adamw
    scheduler: cosine

  phase2:
    enabled: true
    epochs: 50
    lr: 0.0001
    weight_decay: 0.0001
    warmup_ratio: 0.1
    early_stopping_patience: 3
    use_text: true
    p2_report_type: clinical
    init_from_phase1_merged: false
    checkpoint_path: checkpoints/${experiment_name}/seed_${seed}/best_phase2.pth
    loss_type: ce
    optimizer: adamw
    scheduler: cosine
    loss:
      label_smoothing: 0.05
      use_class_weights: true
      weight_type: effective_num
      effective_num_beta: 0.999
      max_class_weight: 5.0
