# @package _global_
# Fusion-only refinement for the canonical XBone-Letterbox model.
# Start close to the concat branch, then learn a gated residual correction from
# one-way image-to-text cross-attention. Reuse Phase 1 and retrain only Phase 2.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net
  - _self_

experiment_name: ctch/ablation_study/architecture/fusion/gated_residual

params:
  run_phase1: false
  phase1:
    enabled: false
    checkpoint_path: checkpoints/ctch/proposed/ours_xbone_net/seed_${seed}/best_phase1.pth

  phase2:
    enabled: true
    init_from_phase1_checkpoint: true
    init_from_phase1_merged: false
    fusion_type: gated_cross_attention
    fusion_params:
      attention_direction: image_to_text
      embed_dim: 512
      num_heads: 8
      dropout: 0.1
      gate_hidden_dim: 128
      # sigmoid(-4) ~= 0.018: initialization is close to concat and lets the
      # cross-attention correction enter only when supported by training.
      gate_bias_init: -4.0
