# @package _global_
# Current-architecture ablation: replace bidirectional cross-attention with
# concatenation while reusing the matching Phase-1 letterbox checkpoint.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net
  - _self_

experiment_name: ctch/ablation_study/architecture/fusion/concat

params:
  run_phase1: false
  phase1:
    enabled: false
    checkpoint_path: checkpoints/ctch/proposed/ours_xbone_net/seed_${seed}/best_phase1.pth
  phase2:
    init_from_phase1_checkpoint: true
    init_from_phase1_merged: false
    fusion_type: concat
