# @package _global_
# Fusion ablation: replace cross-attention with concatenation and projection.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net
  - _self_

experiment_name: ctch/ablation_study/architecture/fusion/concat

params:
  run_phase1: false
  phase1:
    enabled: false
    model_dir: checkpoints/ctch/proposed/ours_xbone_net/seed_${seed}/best_phase1.pth
  phase2:
    init_from_phase1_checkpoint: true
    init_from_phase1_merged: false
    fusion_params:
      attention_direction: concat