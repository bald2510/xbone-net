# @package _global_
# Fusion ablation: image global token attends to text tokens only.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net_v3
  - _self_

experiment_name: ctch/ablation_study/architecture/fusion/image_to_text

params:
  run_phase1: false
  phase1:
    enabled: false
    checkpoint_path: checkpoints/ctch/proposed/ours_xbone_net_v3/seed_${seed}/best_phase1.pth
  phase2:
    init_from_phase1_checkpoint: true
    init_from_phase1_merged: false
    fusion_params:
      attention_direction: image_to_text
