# @package _global_
# Classifier ablation: empirical centroids without v3 class-specific bias.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net
  - _self_

experiment_name: ctch/ablation_study/architecture/classifier/no_class_bias

model:
  classifier:
    params:
      use_class_bias: false

params:
  run_phase1: false
  phase1:
    enabled: false
    checkpoint_path: checkpoints/ctch/proposed/ours_xbone_net/seed_${seed}/best_phase1.pth
  phase2:
    init_from_phase1_checkpoint: true
    init_from_phase1_merged: false
