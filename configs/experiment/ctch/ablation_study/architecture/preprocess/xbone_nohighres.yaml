# @package _global_
# Preprocessing ablation: direct global resize without local high-resolution tiles.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net
  - _self_

experiment_name: ctch/ablation_study/architecture/preprocess/xbone_nohighres

model:
  # Match v3's fusion budget: one global token + 20 deterministic
  # pooled tokens from the single 224x224 view (no local tile encoder passes).
  num_visual_tokens: 20
  single_view_pool_shape: [4, 5]

dataset:
  params:
    high_res:
      enabled: false
    preprocess:
      strategy: direct_resize
