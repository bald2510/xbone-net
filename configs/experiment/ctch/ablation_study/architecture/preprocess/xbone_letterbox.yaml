# @package _global_
# Preprocessing ablation: preserve aspect ratio by letterboxing the global image.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net
  - _self_

experiment_name: ctch/ablation_study/architecture/preprocess/xbone_letterbox

model:
  # Match the proposed fusion budget: one global token + eight deterministic
  # pooled tokens from the single letterboxed view.
  num_visual_tokens: 8
  single_view_pool_shape: [2, 4]

dataset:
  params:
    high_res:
      enabled: false
    preprocess:
      strategy: letterbox
      target_size: 224
      pad_value: black
