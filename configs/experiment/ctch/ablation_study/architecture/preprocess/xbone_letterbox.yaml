# @package _global_
# Preprocessing ablation: preserve aspect ratio by letterboxing the global image.

defaults:
  - /experiment/ctch/proposed/ours_xbone_net_v3
  - _self_

experiment_name: ctch/ablation_study/architecture/preprocess/xbone_letterbox

model:
  # Match v3's fusion budget: one global token + 20 deterministic
  # pooled tokens from the single letterboxed view.
  num_visual_tokens: 20
  single_view_pool_shape: [4, 5]

dataset:
  params:
    high_res:
      enabled: false
    preprocess:
      strategy: letterbox
      target_size: 224
      pad_value: black
