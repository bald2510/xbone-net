# @package _global_
defaults:
- /model/peft@model.peft: full_ft
- /model/fusion@model.fusion: concat
- /model/classifier@model.classifier: linear
- /dataset@dataset: btxrd
- _self_
model:
  backbone_type: pubmedclip
  freeze_backbone: false
experiment_name: btxrd/baselines/finetuned/pubmedclip
params:
  run_phase1: false
  run_phase2: true
  run_ood: false
  model_dir: checkpoints//seed_/
  phase2:
    epochs: 50
    lr: 2e-5
    weight_decay: 1e-4
    optimizer: adamw
    scheduler: cosine
    warmup_ratio: 0.1
    early_stopping_patience: 5
    phase2_loss_type: ce
    use_text: true
    p2_report_type: clinical
    checkpoint_path: checkpoints//seed_/best_phase2.pth
    loss:
      proto_margin: 0.5
      lambda_proto: 0.3
      label_smoothing: 0.1
      use_class_weights: true
      weight_type: effective_num
      effective_num_beta: 0.999
seed: 42
