# @package _global_
defaults:
  - /model/peft@model.peft: none
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: btxrd
  - _self_
model:
  backbone_type: densenet121_imagenet
  freeze_backbone: false
  _placeholder_: true
dataset:
  _placeholder_: true
experiment_name: btxrd/baselines/finetuned/densenet
params:
  run_phase1: false
  run_phase2: true
  model_dir: checkpoints/btxrd/baselines/finetuned/densenet/seed_/
  phase1:
    epochs: 50
    lr: 2e-4
    weight_decay: 1e-2
    optimizer: adamw
    scheduler: cosine
    warmup_ratio: 0.1
    checkpoint_path: checkpoints/btxrd/baselines/finetuned/densenet/seed_/best_phase1.pth
    temperature: 0.07
    loss_type: semantic_matching
    early_stopping_patience: 5
    p1_report_type: clinical
  phase2:
    epochs: 50
    lr: 1e-3
    weight_decay: 1e-4
    optimizer: adamw
    scheduler: cosine
    warmup_ratio: 0.1
    early_stopping_patience: 5
    fusion_type: none
    classifier_type: prototypical
    use_text: false
    p2_report_type: null
    checkpoint_path: checkpoints/btxrd/baselines/finetuned/densenet/seed_/best_phase2.pth
    phase2_loss_type: ce
seed: 42
