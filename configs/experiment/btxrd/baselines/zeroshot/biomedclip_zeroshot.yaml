# @package _global_
# ===============================================================================
# Experiment Config: btxrd/baselines/zeroshot/biomedclip_zeroshot
# Backbone: biomedclip | PEFT: none | Fusion: none | Head: none
# ===============================================================================

defaults:
  - /model/peft@model.peft: none
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: btxrd
  - _self_

# --- Model Architecture ---
model:
  backbone_type: biomedclip
  freeze_backbone: true

# --- Experiment Identifier ---
experiment_name: btxrd/baselines/zeroshot/biomedclip_zeroshot

# --- Training Hyperparameters ---
params:
  run_phase1: false
  run_phase2: false
  run_ood: false                 # Set true only for proposed model to calibrate OOD threshold
  model_dir: checkpoints//seed_/

# --- Global Random Seed ---
seed: 42
