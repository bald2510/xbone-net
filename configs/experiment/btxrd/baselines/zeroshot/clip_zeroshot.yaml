# @package _global_
# ===============================================================================
# Experiment Config: btxrd/baselines/zeroshot/clip_zeroshot
# Backbone: clip | PEFT: none | Fusion: none | Head: none
# Description: Zero-Shot Evaluation Baseline.
# ===============================================================================

defaults:
  - /model/peft@model.peft: none
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: btxrd
  - _self_

# --- Model Architecture ---
model:
  backbone_type: clip
  freeze_backbone: true

# --- Experiment Identifier ---
experiment_name: btxrd/baselines/zeroshot/clip_zeroshot

# --- Training Hyperparameters ---
params:
  run_phase1: false
  run_phase2: false
  run_ood: false                 # Set true only for proposed model to calibrate OOD threshold
  model_dir: checkpoints//seed_/

# --- Experiment Identifier ---
seed: 42
