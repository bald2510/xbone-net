# @package _global_
# ===============================================================================
# Experiment Config: btxrd/proposed/ours_xbone_net
# Backbone: biomedclip | PEFT: qlora | Fusion: cross_attention | Head: prototypical
# ===============================================================================

defaults:
  - /model/peft@model.peft: qlora
  - /model/fusion@model.fusion: cross_attention
  - /model/classifier@model.classifier: prototypical
  - /dataset@dataset: btxrd
  - _self_

# --- Model Architecture ---
model:
  backbone_type: biomedclip
  freeze_backbone: false

# --- Experiment Identifier ---
experiment_name: btxrd/proposed/ours_xbone_net

# --- Training Hyperparameters ---
params:
  run_phase1: true
  run_phase2: true
  run_ood: true                 # Set true only for proposed model to calibrate OOD threshold
  model_dir: checkpoints//seed_/

  # --- Phase 1 Hyperparameters ---
  phase1:
    epochs: 50
    lr: 2e-4
    weight_decay: 1e-2
    optimizer: adamw
    scheduler: cosine
    warmup_ratio: 0.1
    early_stopping_patience: 3  
    checkpoint_path: checkpoints//seed_/best_phase1.pth
    beta: 0.5
    loss_type: semantic_matching
    p1_report_type: clinical

  # --- Phase 2 Hyperparameters ---
  phase2:
    epochs: 50
    lr: 2e-4
    weight_decay: 1e-4
    optimizer: adamw  
    scheduler: cosine
    warmup_ratio: 0.1
    early_stopping_patience: 5
    phase2_loss_type: ce
    use_text: true
    use_focal_loss: true
    gamma: 2.0
    p2_report_type: clinical
    checkpoint_path: checkpoints//seed_/best_phase2.pth
    loss:
      proto_margin: 0.3
      lambda_proto: 0.3
      label_smoothing: 0.1
      use_class_weights: true
      weight_type: effective_num
      effective_num_beta: 0.999

# --- Global Random Seed ---
seed: 42
