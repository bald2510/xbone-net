# @package _global_
# Table 2: Both text — P1 contrastive with xray+clinical + P2 fusion with xray+clinical
defaults:
  - /model/peft@model.peft: qlora
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: btxrd
  - _self_

model:
  _placeholder_: true
dataset:
  _placeholder_: true

experiment_name: "T2_both"

params:
  run_phase1: true
  run_phase2: true
  model_dir: "checkpoints/${experiment_name}/seed_${seed}/"
  phase1:
    epochs: 50
    lr: 2e-4
    weight_decay: 1e-2
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_ratio: 0.1
    checkpoint_path: "checkpoints/${experiment_name}/seed_${seed}/best_phase1.pth"
    temperature: 0.07
    loss_type: "semantic_matching"
    early_stopping_patience: 5
    p1_report_type: "both"
  phase2:
    epochs: 50
    lr: 1e-3
    weight_decay: 1e-4
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_ratio: 0.1
    early_stopping_patience: 5
    fusion_type: "cross_attention"
    classifier_type: "prototypical"
    use_text: true
    p2_report_type: "both"
    checkpoint_path: "checkpoints/${experiment_name}/seed_${seed}/best_phase2.pth"

seed: 42
