# @package _global_
# T6: QLoRA + Phase1(xray) + ConcatFusion(clinical) + LinearHead
defaults:
  - /model/peft@model.peft: qlora
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: btxrd
  - _self_

model:
  _placeholder_: true
dataset:
  _placeholder_: true

experiment_name: "T6_concat_linear"

params:
  run_phase1: true
  run_phase2: true
  model_dir: "checkpoints/${experiment_name}/seed_${seed}/"
  phase1:
    epochs: 50
    lr: 2e-4
    weight_decay: 1e-2
    checkpoint_path: "checkpoints/${experiment_name}/seed_${seed}/best_phase1.pth"
    temperature: 0.07
    loss_type: "semantic_matching"
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_ratio: 0.1
    early_stopping_patience: 5
  phase2:
    epochs: 50
    lr: 1e-3
    weight_decay: 1e-4
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_ratio: 0.1
    early_stopping_patience: 5
    fusion_type: "concat"
    classifier_type: "linear"
    use_text: true
    checkpoint_path: "checkpoints/${experiment_name}/seed_${seed}/best_phase2.pth"

seed: 42
