# @package _global_
# Table 2 row1: BioMedCLIP Frozen + CrossAttention(clinical) + PrototypicalHead
defaults:
  - /model/peft@model.peft: none
  - /model/fusion@model.fusion: none
  - /model/classifier@model.classifier: none
  - /dataset@dataset: btxrd
  - _self_

model:
  _placeholder_: true
dataset:
  _placeholder_: true

experiment_name: "T3_no_ft"

params:
  run_phase1: false
  run_phase2: true
  model_dir: "checkpoints/${experiment_name}/seed_${seed}/"
  phase2:
    epochs: 50
    lr: 1e-3
    weight_decay: 1e-4
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_ratio: 0.1
    early_stopping_patience: 5
    fusion_type: "cross_attention"
    classifier_type: "prototypical"
    use_text: true
    checkpoint_path: "checkpoints/${experiment_name}/seed_${seed}/best_phase2.pth"

seed: 42
